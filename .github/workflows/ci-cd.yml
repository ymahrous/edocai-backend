name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set test environment variables
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=test-key" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=test-key" >> $GITHUB_ENV
          echo "SUPABASE_BUCKET_NAME=test-bucket" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=sk_test_doesnotmatter" >> $GITHUB_ENV
          echo "STRIPE_WEBHOOK_SECRET=whsec_test" >> $GITHUB_ENV
          echo "STRIPE_PRICE_ID_PRO_MONTHLY=price_test" >> $GITHUB_ENV
          echo "STRIPE_PRICE_ID_PRO_ANNUAL=price_test" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "QB_CLIENT_ID=test" >> $GITHUB_ENV
          echo "QB_CLIENT_SECRET=test" >> $GITHUB_ENV
          echo "QB_REDIRECT_URI=http://localhost:8000/api/v1/quickbooks/callback" >> $GITHUB_ENV
          echo "QB_ENVIRONMENT=sandbox" >> $GITHUB_ENV
          echo "RESEND_API_KEY=test" >> $GITHUB_ENV
          echo "MAIL_FROM=test@test.com" >> $GITHUB_ENV
          echo "EXCHANGE_RATE_API_KEY=test" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_ENDPOINT=localhost" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_PASSWORD=test" >> $GITHUB_ENV

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U test

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to Railway
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Login to Railway
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: |
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}